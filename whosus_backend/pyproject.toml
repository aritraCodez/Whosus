[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
warn_unreachable = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true
