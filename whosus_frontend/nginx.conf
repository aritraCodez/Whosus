# Template rendered by the official nginx Docker entrypoint.
# BACKEND_ORIGIN must include http:// or https://, with no path or trailing slash.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 0.0.0.0:${PORT};
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # HTTPS upstreams, including public Render URLs, need SNI and certificate checks.
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"service":"whosus_frontend"}';
    }
    location /api/ {
        proxy_pass ${BACKEND_ORIGIN};
    }
    location = /ws {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Repeat these because nginx replaces inherited proxy_set_header entries
        # when a location adds its own headers.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }
}
